name: Deploy akashic

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build static portal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        # actions/configure-pages v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build portal from Markdown lists
        run: node scripts/build-site.mjs

      - name: Verify generated portal
        run: node scripts/check-site.mjs

      - name: Generate repository intelligence
        uses: egohygiene/relay/actions/repository-intelligence@ca6e9319d5133615c1b9e0b5ea5a4f5d3a113210 # v1.0.0
        with:
          output-directory: "dist/intelligence"
          work-directory: ".cache/repository-intelligence"
          reports-directory: ".reports"
          excluded-paths: >-
            .git,.staging,.cache,.venv,node_modules,vendor,dist,build,coverage,
            __pycache__,.reports
          analytics-excluded-paths: >-
            .git,.staging,.cache,.venv,.tox,.mypy_cache,.pytest_cache,
            .ruff_cache,node_modules,vendor,dist,build,coverage,__pycache__,
            .reports,target
          activity-since: "1 year ago"
          max-depth: "10"
          require-full-history: "true"

      - name: Verify complete Pages artifact
        run: node scripts/check-intelligence.mjs

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        # actions/upload-pages-artifact v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        # actions/deploy-pages v5.0.0
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
