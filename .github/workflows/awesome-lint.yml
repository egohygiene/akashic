name: Awesome Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/awesome-lint.yml"
      - "scripts/validate-collection.mjs"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/awesome-lint.yml"
      - "scripts/validate-collection.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "awesome-lint-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  awesome-lint:
    name: Awesome Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate collection
        run: node scripts/validate-collection.mjs

      - name: Lint all lists
        run: |
          for awesome_list_directory in "." lists/*/; do
            (
              cd "${awesome_list_directory}"
              npx --yes "awesome-lint@2.3.0"
            )
          done
