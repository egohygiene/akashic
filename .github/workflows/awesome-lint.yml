name: Awesome Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/awesome-lint.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/awesome-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "awesome-lint-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  awesome-lint:
    name: Awesome Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run awesome-lint
        run: npx --yes awesome-lint@2.3.0
