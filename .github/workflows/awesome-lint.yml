name: Awesome Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/awesome-lint.yml"
      - "scripts/validate-collection.mjs"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/awesome-lint.yml"
      - "scripts/validate-collection.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "awesome-lint-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  awesome-lint:
    name: Awesome Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate collection
        run: node scripts/validate-collection.mjs

      - name: Lint all resource lists
        shell: bash
        run: |
          while IFS= read -r awesome_list_readme; do
            awesome_list_directory="$(dirname "${awesome_list_readme}")"
            awesome_lint_input="${awesome_list_directory}/.awesome-lint-input.md"

            {
              # These collection-wide concerns are validated from the repository root.
              printf '%s\n' '<!--lint disable awesome-contributing awesome-github double-link-->'
              sed '1{/^<!--lint disable awesome-git-repo-age-->$/d;}' "${awesome_list_readme}"
            } > "${awesome_lint_input}"

            if ! npx --yes "awesome-lint@2.3.0" "${awesome_lint_input}"; then
              rm "${awesome_lint_input}"
              exit 1
            fi

            rm "${awesome_lint_input}"
          done < <(
            find "lists" -name "README.md" \
              -not -path "lists/awesome-abundance/README.md" | sort
          )
