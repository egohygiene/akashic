---
name: Retain Repository Intelligence failure evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "repository-intelligence-failure-evidence-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  failure-evidence:
    name: Reject invalid input and retain sanitized evidence
    permissions:
      contents: read
    uses: egohygiene/relay/.github/workflows/repository-intelligence.yml@49046d88ef6fe2e31e9a9f443a61157b598efb78
    with:
      artifact-retention-days: 30
      max-depth: "21"
