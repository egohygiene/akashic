name: Search research

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/search-research.yml"
      - "package.json"
      - "research/search/**"
      - "scripts/build-site.mjs"
      - "scripts/benchmark-search.mjs"
      - "scripts/check-site.mjs"
      - "scripts/compare-search-results.mjs"
      - "scripts/evaluate-search.mjs"
      - "scripts/lib/search-evaluation.mjs"
      - "site/app.js"
      - "site/search.js"
      - "site/search-lab.*"
      - "site/search/**"
      - "test/search-lab.test.mjs"
      - "test/search-evaluation.test.mjs"
      - "test/search-fusion.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/search-research.yml"
      - "package.json"
      - "research/search/**"
      - "scripts/build-site.mjs"
      - "scripts/benchmark-search.mjs"
      - "scripts/check-site.mjs"
      - "scripts/compare-search-results.mjs"
      - "scripts/evaluate-search.mjs"
      - "scripts/lib/search-evaluation.mjs"
      - "site/app.js"
      - "site/search.js"
      - "site/search-lab.*"
      - "site/search/**"
      - "test/search-lab.test.mjs"
      - "test/search-evaluation.test.mjs"
      - "test/search-fusion.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Reproduce search baseline
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Protect the published v1 algorithm and fixture
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:site/search/and-substring-v1.js" 2>/dev/null \
            && ! git diff --quiet "${BASE_SHA}" -- site/search/and-substring-v1.js; then
            echo "and-substring-v1 is a published baseline; add a new versioned module instead of editing it."
            exit 1
          fi
          if git cat-file -e "${BASE_SHA}:research/search/evaluations/natural-language-v1.json" 2>/dev/null \
            && ! git diff --quiet "${BASE_SHA}" -- research/search/evaluations/natural-language-v1.json; then
            echo "natural-language-v1 is a published fixture; add a versioned extension instead of editing it."
            exit 1
          fi

      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/needs.js
          node --check site/search.js
          node --check site/search-lab.js
          node --check site/search-lab-metrics.js
          node --check site/search/and-substring-v1.js
          node --check site/search/concepts-v1.js
          node --check site/search/weighted-lexical-v2.js
          node --check research/search/algorithms/decomposition-rrf-v1.js
          node --check scripts/benchmark-search.mjs
          node --check scripts/compare-search-results.mjs
          node --check scripts/evaluate-search.mjs
          node --check scripts/lib/search-evaluation.mjs
          node --check scripts/lib/search-licenses.mjs
          node --check scripts/check-site.mjs
          node --check scripts/validate-search-licenses.mjs

      - name: Validate search license ledger
        run: node scripts/validate-search-licenses.mjs

      - name: Build static catalog
        run: node scripts/build-site.mjs

      - name: Verify browser build integration
        run: node scripts/check-site.mjs

      - name: Verify static search performance report
        run: node scripts/benchmark-search.mjs --profile standard --warmup-passes 1 --measurement-passes 1 --static-verify research/search/results/weighted-lexical-v2-performance-v1.json

      - name: Verify committed baseline
        run: node scripts/evaluate-search.mjs --fixture research/search/evaluations/natural-language-v1.json --verify research/search/results/and-substring-v1.json

      - name: Verify active lexical experiment
        run: node scripts/evaluate-search.mjs --fixture research/search/evaluations/natural-language-v1.json --algorithm site/search/weighted-lexical-v2.js --verify research/search/results/weighted-lexical-v2.json

      - name: Verify decomposition fusion experiment
        run: node scripts/evaluate-search.mjs --fixture research/search/evaluations/natural-language-v1.json --algorithm research/search/algorithms/decomposition-rrf-v1.js --verify research/search/results/decomposition-rrf-v1.json

      - name: Verify fusion acceptance decision
        run: node scripts/compare-search-results.mjs --baseline research/search/results/weighted-lexical-v2.json --candidate research/search/results/decomposition-rrf-v1.json --gate research/search/evaluations/fusion-no-harm-v1.json --verify research/search/results/decomposition-rrf-v1-decision.json

      - name: Verify v2 substring checkpoint
        run: node scripts/evaluate-search.mjs --fixture research/search/evaluations/natural-language-v2.json --verify research/search/results/and-substring-v1-evaluation-v2.json

      - name: Verify v2 active lexical checkpoint
        run: node scripts/evaluate-search.mjs --fixture research/search/evaluations/natural-language-v2.json --algorithm site/search/weighted-lexical-v2.js --verify research/search/results/weighted-lexical-v2-evaluation-v2.json

      - name: Verify v2 decomposition fusion checkpoint
        run: node scripts/evaluate-search.mjs --fixture research/search/evaluations/natural-language-v2.json --algorithm research/search/algorithms/decomposition-rrf-v1.js --verify research/search/results/decomposition-rrf-v1-evaluation-v2.json

      - name: Verify v2 fusion acceptance decision
        run: node scripts/compare-search-results.mjs --baseline research/search/results/weighted-lexical-v2-evaluation-v2.json --candidate research/search/results/decomposition-rrf-v1-evaluation-v2.json --gate research/search/evaluations/fusion-no-harm-v1.json --verify research/search/results/decomposition-rrf-v1-decision-v2.json
